<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        table{
            width: 400px;
            border-collapse: collapse;
            border: 2px solid rgb(1, 27, 37);
        }
        td{
            border: 1px solid black;

            padding: 5px;
        }
        tr.linha{
            background-color: rgb(92, 133, 149);
        }
        td.coluna{
            background-color: rgb(13, 77, 100);
        }
    </style>
    <title>Tabelas</title>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <table>
        <tr class="linha">
            <td class="coluna">A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr>
            <td class="coluna">A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr>
            <td class="coluna">A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
    </table>
</body>
</html>

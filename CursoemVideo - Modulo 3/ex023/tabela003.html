<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        caption{
            background-color: lightgray;
            font-weight: 600;
        }
        table{
            border-collapse: collapse;
            width: 400px;
        }
        body{
            font-family: sans-serif;
        }
        tbody > tr:nth-child(odd){
            background-color: lightgray;
        }
        td, th{
            border: 1px solid black;
        }
        .num{
            text-align: right;
        }
        tfoot, thead{
            background-color: rgb(58, 58, 58);
            color: white;
        }
    </style>
    <title>Tabela</title>
</head>
<body>
    <h1>Mesclagem  de celulas</h1>
    <table>
        <caption>Populacao brasileira</caption>
        <thead>
            <tr>
                <th scope="col">Estado</th>
                <th scope="col">Populacao</th>
                <th scope="col">Porcentagem</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Sao Paulo</td>
                <td class="num" colspan="2">000 000 000</td> 
            </tr>
            <tr>
                <td>Sao Paulo</td>
                <td class="num">000 000 000</td>
                <td class="num">0%</td>
            </tr>
            <tr>
                <td rowspan="3">Sao Paulo</td>
                <td class="num">000 000 000</td>
                <td class="num">0%</td>
            </tr>
            <tr>
                
                <td class="num">000 000 000</td>
                <td class="num">0%</td>
            </tr>
            <tr>
                
                <td class="num">000 000 000</td>
                <td class="num">0%</td>
            </tr>
            <tr>
                <td>Sao Paulo</td>
                <td class="num">000 000 000</td>
                <td class="num">0%</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th
                scope="row">Total</th>
                <td class="num">000 000 000</td>
                <td class="num">0%</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
